name: discover
on:
  workflow_dispatch:
  push:
    paths: ["discover/channels.json", "discover/request.txt", "discover/yt_queries.json"]
  schedule:
    - cron: "*/30 * * * *"
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -U yt-dlp
      - run: python3 tools/discover.py
      - run: python3 tools/discover_yt.py || true
      - run: |
          git config user.name "vicecityclipssix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add discover/latest.json discover/youtube.json || true; git add discover/latest.json
          git commit -m "discover: top clips" || exit 0
          git pull --rebase && git push
