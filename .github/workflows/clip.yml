name: clip
on:
  workflow_dispatch:
  push:
    paths: ["jobs/**"]
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          (curl -sfL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ && sudo cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/) \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          rm -rf ffmpeg-*-static; ffmpeg -version | head -1
      - run: pip install -U yt-dlp pillow
      - run: python3 tools/process.py
      - run: |
          git config user.name "vicecityclipssix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out; find src -maxdepth 1 -name "*.mp4" -size -95M -exec git add {} +
          git commit -m "clip: rendered" || exit 0
          git pull --rebase && git push
