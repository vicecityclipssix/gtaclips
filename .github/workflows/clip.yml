name: clip
on:
  workflow_dispatch:
  push:
    paths: ["jobs/**"]
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ
          sudo cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/ && rm -rf ffmpeg-*-static
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -U yt-dlp pillow
      - run: python3 tools/process.py
      - run: |
          git config user.name "vicecityclipssix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out
          git commit -m "clip: rendered" || exit 0
          git pull --rebase && git push
