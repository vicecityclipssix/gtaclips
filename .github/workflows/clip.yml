name: clip
on:
  workflow_dispatch:
  push:
    paths: ["jobs/**"]
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -U yt-dlp pillow
      - run: python3 tools/process.py
      - run: |
          git config user.name "vicecityclipssix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out
          git commit -m "clip: rendered" || exit 0
          git pull --rebase && git push
